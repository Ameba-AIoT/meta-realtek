#@TYPE: Machine
#@NAME: Realtek RTL8730EAH-VD3 IoT Development Board (NOR+PSRAM XIP)
#@DESCRIPTION: Machine configuration for Realtek RTL8730EAH-VD3 IoT Development Board (16MB NOR + 8MB PSRAM, XIP)

require include/rtl8730e-evk.inc

# cramfs-xip: XIP read-only rootfs, ELF text runs from the NOR AXI window
# (not inflated into page cache). See the .inc; resolved via BBPATH.
require conf/distro/include/cramfs-xip.inc

IMAGE_FEATURES += " read-only-rootfs read-only-rootfs-delayed-postinsts"

# squashfs-xz kept as bring-up fallback/baseline (smaller flash, but no XIP).
IMAGE_FSTYPES += "cramfs-xip squashfs-xz jffs2"

# Flash diet: drop the blanket "kernel-modules" RRECOMMENDS (evk.inc pulls in
# every .ko); this rootfs needs none. Add back specific kernel-module-<name> if needed.
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:remove = "kernel-modules"

# Flash diet round 2: busybox init/mdev (drops udev/sysvinit) + strip netbase/modutils.
# :forcevariable overrides ameba-base.inc's hard INIT_MANAGER = "sysvinit".
INIT_MANAGER:forcevariable = "mdev-busybox"
VIRTUAL-RUNTIME_dev_manager = "busybox-mdev"
VIRTUAL-RUNTIME_update-alternatives = ""
RDEPENDS:packagegroup-core-boot:remove = "netbase modutils-initscripts"

# getty baud (busybox-inittab reads SERIAL_CONSOLES); console runs at 1500000,
# not evk.inc's 115200 default.
SERIAL_CONSOLES = "1500000;ttyS0"

KERNEL_DEVICETREE = "\
    realtek/ameba/rtl8730eah-vd3-generic.dtb \
    realtek/ameba/rtl8730eah-vd3-full.dtb \
"

EXTRA_IMAGEDEPENDS += "atf-ameba u-boot-ameba optee-client-ameba optee-os-ameba"

JFFS2_ENDIANNESS = "0x300000"
JFFS2_ERASEBLOCK = "0x10000"

UBOOT_MACHINE = "rtl8730eah-vd3_defconfig"
UBOOT_ENTRYPOINT = "0x60388000"

# XIP kernel: boots a fixed xipImage in place from NOR (no opt_read normal/recovery
# auto-select, which would force a fatal copy into DRAM).
KERNEL_IMAGETYPE = "xipImage"
KERNEL_EXTRA_ARGS = ""

# LOAD = kernel CONFIG_XIP_PHYS_ADDR (1MB-aligned). Keep in sync: xip_defconfig
# XIP_PHYS_ADDR, LOAD/PART here, uboot XIP_HDR_ADDR (=LOAD-0x40, bootm zero-copy).
XIP_FLASH_LOAD_ADDR = "0x08300000"
# PART = nearest 4KB erase block below LOAD (front padding only 4032 bytes).
XIP_FLASH_PART_ADDR = "0x082FF000"
