#@TYPE: Machine
#@NAME: Realtek RTL8730ELH-VA7 IoT Development Board
#@DESCRIPTION: Machine configuration for Realtek RTL8730ELH-VA7 IoT Development Board

require include/rtl8730e-evk.inc

IMAGE_FEATURES += " read-only-rootfs"

KERNEL_DEVICETREE = "\
    realtek/ameba/rtl8730elh-va7-full.dtb \
    realtek/ameba/rtl8730elh-va7-generic.dtb \
    realtek/ameba/rtl8730elh-va7-tests-adc-diff.dtb \
    realtek/ameba/rtl8730elh-va7-tests-adc-sig.dtb \
    realtek/ameba/rtl8730elh-va7-tests-ctc.dtb \
    realtek/ameba/rtl8730elh-va7-tests-i2c.dtb \
    realtek/ameba/rtl8730elh-va7-tests-ir-rx.dtb \
    realtek/ameba/rtl8730elh-va7-tests-ir-tx.dtb \
    realtek/ameba/rtl8730elh-va7-tests-misc.dtb \
    realtek/ameba/rtl8730elh-va7-tests-spi.dtb \
    realtek/ameba/rtl8730elh-va7-tests-uart.dtb \
    realtek/ameba/rtl8730elh-va7-tests-display.dtb \
"

EXTRA_IMAGEDEPENDS += "atf-ameba u-boot-ameba optee-client-ameba optee-os-ameba"

MKUBIFS_ARGS = "-F -m 2048 -e 126976 -c 436 -j 380928"

UBOOT_MACHINE = "rtl8730elh-va7_defconfig"
UBOOT_ENTRYPOINT = "0x60388000"
