#@TYPE: Machine
#@NAME: Realtek RTL8730EAM-VA6 IoT Development Board
#@DESCRIPTION: Machine configuration for Realtek RTL8730EAM-VA6 IoT Development Board

require include/rtl8730e-evk.inc

IMAGE_FEATURES += " read-only-rootfs read-only-rootfs-delayed-postinsts"

IMAGE_FSTYPES += "squashfs jffs2"

KERNEL_DEVICETREE = "\
    realtek/ameba/rtl8730eam-va6-generic.dtb \
    realtek/ameba/rtl8730eam-va6-full.dtb \
"

EXTRA_IMAGEDEPENDS += "atf-ameba u-boot-ameba optee-client-ameba optee-os-ameba"

JFFS2_ENDIANNESS = "0x300000"
JFFS2_ERASEBLOCK = "0x10000"

UBOOT_MACHINE = "rtl8730eam-va6_defconfig"
UBOOT_ENTRYPOINT = "0x60388000"
